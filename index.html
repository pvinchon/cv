<meta charset="utf-8">
<title>Philippe Hosey Vinchon CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
@theme {
  --font-sans: "Inter", system-ui, sans-serif;

  /* Plain neutral greys and one blue, after coolors.co. */
  --color-paper: #ffffff;
  --color-ink: #0a0a0a;
  --color-body: #525252;
  --color-muted: #737373;
  --color-faint: #a3a3a3;
  --color-accent: #2563eb;

  /* Behind the sheets on screen; never printed. */
  --color-desk: #f5f5f5;

  /* Type scale: big jumps on purpose. */
  --text-name: 25pt;
  --text-name--line-height: 1.08;
  --text-section: 15pt;
  --text-section--line-height: 1.2;
  --text-lead: 10.5pt;
  --text-lead--line-height: 1.62;
  --text-h2: 11.5pt;
  --text-h2--line-height: 1.25;
  --text-org: 9pt;
  --text-org--line-height: 1.3;
  --text-body: 9.4pt;
  --text-body--line-height: 1.55;
  --text-meta: 7.4pt;
  --text-meta--line-height: 1.5;

  --spacing-rail: 6.5rem;
}

@layer base {
  /* The publish step supplies its own <body>, so page defaults are set here
     rather than as classes on an element this file does not own. */
  body {
    background: var(--color-desk);
    color: var(--color-body);
    font-size: var(--text-body);
    line-height: var(--text-body--line-height);
    -webkit-font-smoothing: antialiased;
  }

  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  strong { font-weight: 600; color: var(--color-ink); }
}

@layer components {
  /* An A4 page on screen. On paper, @page supplies the size and margins. */
  @media screen {
    .sheet {
      width: 210mm;
      min-height: 297mm;
      padding: 13mm 15mm;
      margin: 2rem auto;
      background: var(--color-paper);
      box-shadow: 0 1px 4px rgb(0 0 0 / 0.15);
    }
  }

  .bullets { list-style: "\2013\2002"; padding-left: 0.95rem; }
  .bullets > li::marker { color: var(--color-faint); }
}

@page { size: A4; margin: 13mm 15mm; }

@media print {
  /* Print the colours as specified instead of letting the browser
     second-guess them. */
  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  html, body { background: #fff !important; }

  h2, h3 { break-after: avoid; }

  /* Safari honours only the legacy property, so both are set. */
  .sheet + .sheet { page-break-before: always; break-before: page; }
}
</style>

<div id="cv"></div>

<script src="content.js"></script>
<script>
const link = (href) =>
  `<a class="text-accent" href="${href}">${href.replace(/^(https?:\/\/|mailto:)/, "")}</a>`;

const entry = (e, gap) => `
  <article class="${gap} grid grid-cols-[theme(spacing.rail)_1fr] gap-x-7 break-inside-avoid">
    <div class="pt-1.5 text-meta tabular-nums text-muted">
      ${e.from}<br>${e.to}
      <span class="mt-1 block text-faint">${e.duration}</span>
    </div>
    <div class="min-w-0">
      <h3 class="text-h2 font-bold tracking-tight text-ink">
        ${e.name}
        ${e.url ? `<span class="text-org font-normal text-muted">${e.note ? `${e.note} ` : ""}&middot; ${link(e.url)}</span>` : ""}
      </h3>
      ${e.role ? `<p class="mt-0.5 text-org font-semibold">${e.role}</p>` : ""}
      ${e.bullets ? `<ul class="bullets mt-2 flex flex-col gap-1">${e.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>` : ""}
      ${e.text ? `<p class="mt-2">${e.text}</p>` : ""}
      ${e.stack ? `<p class="mt-2 text-meta text-muted">${e.stack.join(" &middot; ")}</p>` : ""}
    </div>
  </article>`;

const entries = (list, gap) => list.map((e, i) => entry(e, i ? gap : "")).join("");

document.getElementById("cv").innerHTML = `
  <div class="sheet">
    <header class="flex flex-wrap items-end justify-between gap-x-8 gap-y-4">
      <div>
        <h1 class="text-name font-extrabold tracking-[-0.04em] text-ink text-balance">${cv.name}</h1>
        <p class="mt-2 text-lead">${cv.headline}</p>
      </div>
      <div class="text-meta tabular-nums leading-[1.9] text-muted text-right">
        ${cv.location}<br>
        ${link(`mailto:${cv.email}`)}<br>
        ${cv.phone}<br>
      </div>
    </header>

    <div class="mt-10 flex flex-col gap-4 text-lead">
      ${cv.intro.map((p) => `<p>${p}</p>`).join("")}
    </div>

    <section class="mt-12">
      <h2 class="mb-4 text-section font-extrabold tracking-[-0.03em] text-ink">${cv.projects.title}</h2>
      ${entries(cv.projects.entries, "mt-6")}
    </section>
  </div>

  <div class="sheet">
    <section>
      <h2 class="mb-3 text-section font-extrabold tracking-[-0.03em] text-ink">${cv.experience.title}</h2>
      ${entries(cv.experience.entries, "mt-4")}
    </section>
  </div>`;
</script>
